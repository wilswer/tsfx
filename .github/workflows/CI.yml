#
#    maturin generate-ci github --platform manylinux musllinux macos windows
#
name: CI

on:
  push:
    tags:
      - '*'
    # Other branches are tested through their pull request
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# setup-python steps pin a Python version: "3.x" follows new releases, and
# 3.15.0's Windows x86 build failed to start in the toolcache (abi3 wheels do
# not depend on the build interpreter)

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # A version bump is pushed together with its tag, and the tag's run tests
    # the same commit, so skip the redundant branch run for it.
    if: ${{ startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Bump version') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo test
        run: cargo test --release
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      # Built on the runner rather than in a manylinux container, so it reuses
      # the cached target directory; this wheel is only tested, not released
      - name: Build wheel
        run: uvx maturin build --release --out dist
      - name: Upload test wheel
        uses: actions/upload-artifact@v6
        with:
          name: test-wheel
          path: dist
      - name: Run pytest
        run: |
          uv pip install --system dist/*.whl pytest
          pytest
      - name: Fuzz against tsfresh and scikit-learn
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          # bit-exact parity is checked against these versions
          uv pip install --system hypothesis tsfresh==0.21.2 numpy==2.4.4 pandas==3.0.2 scipy==1.17.1 statsmodels==0.15.0 scikit-learn==1.8.0
          pytest -m fuzz

  # The abi3 wheel claims Python >= 3.11; run the tests on the oldest version
  test-py311:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v7
        with:
          name: test-wheel
          path: dist
      - name: Run pytest
        run: |
          uv pip install --system dist/*.whl pytest
          pytest

  # The checks pre-commit runs, for commits made without it. Versions match
  # .pre-commit-config.yaml
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Bump version') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: ruff
        run: |
          uvx ruff@0.15.18 check python
          uvx ruff@0.15.18 format --check .
      - name: mypy
        run: uv run --no-project --with mypy==2.1.0 --with polars==1.44.2 mypy python/tsfx

  # Built on every run so broken docs fail the pull request; deployed by
  # deploy-docs after a release
  docs:
    name: Docs
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Bump version') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          source .venv/bin/activate
          pip install maturin mkdocs-material mkdocstrings-python
          maturin develop
      - name: Build MkDocs (Python docs)
        run: mkdocs build
      - name: Build Cargo docs (Rust docs)
        # Load KaTeX so $$...$$ formulas in doc comments render
        env:
          RUSTDOCFLAGS: --html-in-header ${{ github.workspace }}/src/html/docs-header.html
        run: cargo doc --no-deps --document-private-items
      - name: Merge Rust docs into MkDocs
        run: |
          mkdir -p site/rust
          cp -r target/doc/* site/rust/
      - name: Upload site
        uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: site

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
        with:
          target: ${{ matrix.platform.target }}
          # One abi3 wheel for CPython >= 3.11. No free-threaded or PyPy
          # wheels: polars ships only abi3 wheels, which neither can install
          args: --release --out dist -i python3.11
          sccache: false
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheels
        env:
          CFLAGS_aarch64_unknown_linux_musl: "-D__ARM_ARCH=8"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # As for manylinux: the abi3 wheel only
          args: --release --out dist -i python3.11
          sccache: false
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    # PyPI trusts this workflow and environment (trusted publishing), so no
    # API token is stored
    environment: pypi
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [test-py311, lint, docs, linux, musllinux, windows, macos, sdist]
    permissions:
      # Used to sign the release artifacts and to get the PyPI upload token
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish --trusted-publishing always 'wheels-*/*'

  deploy-docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: [docs, release]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: site
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
