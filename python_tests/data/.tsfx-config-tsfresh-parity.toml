# Features and parameters used by python_tests/test_tsfresh_parity.py.
# Parameters mirror the cases in tsfresh v0.21.2
# tests/units/feature_extraction/test_feature_calculations.py.

[skewness]

[root_mean_square]

[kurtosis]

[mean_absolute_change]

[ratio_beyond_r_sigma]
parameters = [{ r = 1.0 }, { r = 2.0 }, { r = 3.0 }, { r = 20.0 }]

[cid_ce]
parameters = [{ normalize = true }, { normalize = false }]

[absolute_maximum]

[absolute_sum_of_changes]

[count_above_mean]

[count_below_mean]

[count_above]
parameters = [{ t = 0.0 }, { t = 0.2 }, { t = 1.0 }, { t = 5.0 }]

[count_below]
parameters = [{ t = 0.0 }, { t = 0.2 }, { t = 1.0 }, { t = 5.0 }]

[first_location_of_maximum]

[first_location_of_minimum]

[last_location_of_maximum]

[last_location_of_minimum]

[longest_strike_above_mean]

[longest_strike_below_mean]

[autocorrelation]
parameters = [
    { lag = 0 },
    { lag = 1 },
    { lag = 2 },
    { lag = 3 },
    { lag = 4 },
    { lag = 200 },
]

[standard_deviation]

[variance]

[variation_coefficient]

[variance_larger_than_standard_deviation]

[large_standard_deviation]
parameters = [{ r = 0.0 }, { r = 0.25 }, { r = 0.3 }, { r = 0.5 }]
