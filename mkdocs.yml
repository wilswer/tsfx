# mkdocs.yml
site_name: tsfx Documentation
site_description: TSFX -- Time Series Feature eXtraction
theme:
  name: material
  palette:
    scheme: slate # Dark mode by default!

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            merge_init_into_class: true

markdown_extensions:
  - pymdownx.snippets:
      base_path: .    # Tells snippets to look in the project root

nav:
  - Home: index.md
  - API Reference: api.md
  - Rust Internals: rust/tsfx/index.html
