[package]
name = "tsfx"
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tsfx"
crate-type = ["lib", "cdylib"]

[lints.rust]
# unused = "allow" # For exploratory dev.

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
pyo3 = "0.28"
chrono = "0.4.42"
csv = "1.3"
ndarray = "0.17"
ndarray-stats = "0.7"
polars = { git = "https://github.com/pola-rs/polars.git", rev = "bf6a425f4ecdc53fd5d0c4b47ef4a08ca61f8d87", features = [
  "polars-io",
  "lazy",
  "csv",
  "diff",
  "dynamic_group_by",
  "strings",
  "ndarray",
  "dtype-struct",
  "dtype-array",
  "nightly",
  "regex",
  "timezones",
  "abs",
  "object",
] }
pyo3-polars = { git = "https://github.com/pola-rs/polars.git", rev = "bf6a425f4ecdc53fd5d0c4b47ef4a08ca61f8d87", features = ["lazy", "dtype-struct"] }
noisy_float = "0.2"
itertools = "0.14"
ordered-float = "5.1"
num = "0.4"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "./src/html/docs-header.html"]

[[bench]]
name = "bench_main"
harness = false
