[package]
name = "tsfx"
version = "0.7.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tsfx"
crate-type = ["lib", "cdylib"]

[lints.rust]
# unused = "allow" # For exploratory dev.

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# abi3: one wheel per platform for every CPython >= 3.11, including future
# versions. Free-threaded CPython and PyPy have no stable ABI: on Linux, CI
# builds version-specific wheels for them (see the -i flags in CI.yml)
pyo3 = { version = "0.29", features = ["abi3-py311"] }
chrono = "0.4.42"
csv = "1.3"
ndarray = "0.17"
polars = { git = "https://github.com/pola-rs/polars.git", rev = "1bd8ec12f42d40fcec62badf32ef2177d2377d8d", features = [
  "polars-io",
  "lazy",
  "csv",
  "diff",
  "dynamic_group_by",
  "strings",
  "ndarray",
  "dtype-struct",
  "dtype-array",
  "nightly",
  "regex",
  "timezones",
  "abs",
  "object",
] }
pyo3-polars = { git = "https://github.com/pola-rs/polars.git", rev = "1bd8ec12f42d40fcec62badf32ef2177d2377d8d", features = ["lazy", "dtype-struct"] }
itertools = "0.14"
thiserror = "2"
anyhow = "1"
rustfft = "6.4.1"
nalgebra = "0.35.0"
libm = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "./src/html/docs-header.html"]

[[bench]]
name = "bench_main"
harness = false

# Strip symbols from release builds: smaller wheels (PyPI limits a project's
# total size), no effect on speed
[profile.release]
strip = true

# Benches inherit the release profile; keep their symbols for profiling
[profile.bench]
strip = false
